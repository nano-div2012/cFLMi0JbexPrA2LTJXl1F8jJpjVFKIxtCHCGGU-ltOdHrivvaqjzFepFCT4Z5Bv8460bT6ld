<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WA Hanz</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}
body{background:#1a0000;color:#fff;height:100vh;display:flex;flex-direction:column}
input,textarea{width:100%;padding:14px;margin:6px 0;border:none;border-radius:20px;background:#330000;color:#fff;outline:none}
button{border:none;border-radius:20px;padding:13px;cursor:pointer;font-weight:bold}
.verified{color:#1DA1F2}
.badgeOwner{font-size:10px;background:#E60014;color:#fff;padding:2px 6px;border-radius:10px}
.badgeAdmin{font-size:10px;background:#FFAA00;color:#000;padding:2px 6px;border-radius:10px}
#login{margin:auto;background:#220000;padding:25px;border-radius:20px;width:92%;max-width:360px;text-align:center;border:2px solid #E60014}
#app{display:none;flex-direction:column;flex:1}
.headerWA{background:#E60014;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.headerWA img{width:36px;height:36px;border-radius:50%;border:2px solid #fff;cursor:pointer}
.listChat{flex:1;overflow-y:auto;padding-bottom:80px}
.chatItem{display:flex;gap:12px;padding:12px 16px;align-items:center;cursor:pointer}
.chatItem img{width:52px;height:52px;border-radius:50%;border:2px solid #E60014}
.chatItem .tengah{flex:1;min-width:0}
.btnPlus{position:fixed;bottom:90px;right:16px;width:58px;height:58px;background:#E60014;border-radius:16px;font-size:28px;color:#fff;display:flex;align-items:center;justify-content:center;z-index:50}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#220000;display:flex;padding:8px 0;z-index:50}
.bottomNav button{flex:1;background:transparent;color:#aaa;font-size:12px;padding:4px}
#chatRoom{position:fixed;inset:0;background:#EFEAE2;display:none;flex-direction:column;z-index:100}
#chatRoom header{background:#E60014;padding:10px;display:flex;gap:10px;align-items:center;color:#fff}
#chatRoom header img{width:40px;height:40px;border-radius:50%;border:2px solid #fff}
#chatBox{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:15px;position:relative;padding-bottom:18px}
.me{background:#FFD0D0;color:#000;align-self:flex-end}
.other{background:#fff;color:#000;align-self:flex-start}
.msg small{position:absolute;right:8px;bottom:3px;font-size:10px;color:#666}
.enc{background:#FFF3CD;color:#333;font-size:12px;text-align:center;padding:8px;border-radius:10px;margin:6px 30px}
.lockBar{background:#333;color:#fff;font-size:12px;text-align:center;padding:10px}
#bar{background:#fff;padding:8px;display:flex;gap:6px;align-items:center}
#bar .kotak{flex:1;background:#fff;border-radius:25px;display:flex;align-items:center;padding:6px 10px;gap:6px}
#bar .kotak input{flex:1;background:transparent;color:#000;padding:6px;margin:0}
.micBtn{width:48px;height:48px;border-radius:50%;background:#25D366;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:400;padding:20px}
.modalBox{background:#220000;border:2px solid #E60014;border-radius:20px;padding:20px;width:100%;max-width:380px;text-align:center;max-height:92vh;overflow-y:auto}
.pageLain{position:fixed;inset:0;background:#1a0000;display:none;flex-direction:column;z-index:100;padding-bottom:80px}
.pageLain header{background:#E60014;padding:12px 16px;display:flex;gap:10px;align-items:center}
.card{background:#220000;margin:10px;border-radius:15px;padding:12px;display:flex;gap:10px;align-items:center}
.card img{width:60px;height:60px;border-radius:50%}
#pageBuatSaluran,#pageBuatKomunitas{position:fixed;inset:0;background:#fff;color:#000;display:none;flex-direction:column;z-index:300}
#pageBuatSaluran header,#pageBuatKomunitas header{background:#fff;padding:14px 16px;display:flex;gap:14px;align-items:center;border-bottom:1px solid #eee;color:#000}
.ppWrap{position:relative;width:140px;height:140px;margin:30px auto 20px}
.ppWrap img{width:140px;height:140px;border-radius:50%;background:#D3D3D3;object-fit:cover}
.ppWrap .cam{position:absolute;right:0;bottom:5px;width:44px;height:44px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid #fff;cursor:pointer}
.inputSaluran{border:none;border-bottom:1px solid #ccc;background:transparent;color:#000;padding:14px 6px;font-size:18px}
.textareaSaluran{width:100%;background:#F0F2F5;border:none;border-bottom:1px solid #ccc;padding:14px;font-size:16px;min-height:110px;color:#000;resize:none}
.linkBox{background:#F0F2F5;color:#000;padding:12px;border-radius:12px;word-break:break-all;font-size:13px;text-align:left;margin:10px 0}
#stickerPanel{background:#fff;color:#000;display:none;border-top:1px solid #ddd;max-height:55vh;overflow-y:auto}
.stickerTop{display:flex;align-items:center;gap:10px;padding:10px}
.stickerTabs{display:flex;flex:1;background:#F0F2F5;border-radius:20px;overflow:hidden}
.stickerTabs button{flex:1;background:transparent;color:#000;font-size:18px;padding:8px}
.stickerTabs button.active{background:#fff;border:1px solid #ddd}
.stickerGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px}
.stickerItem{aspect-ratio:1;background:#E8E8E8;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;font-size:28px}
.stickerItem small{font-size:9px;font-weight:bold;text-align:center;line-height:1.1;background:rgba(0,0,0,.6);color:#fff;width:100%;position:absolute;bottom:0;padding:3px}
.packBar{display:flex;gap:8px;padding:8px;overflow-x:auto;border-top:1px solid #eee}
.packBar button{font-size:24px;background
